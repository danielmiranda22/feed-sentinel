name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only needs to read the code.
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore FeedSentinel.slnx
      - run: dotnet build FeedSentinel.slnx -c Release --no-restore
      - run: dotnet test FeedSentinel.slnx -c Release --no-build